
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#102b26">
<title>Misi Pahlawan Alpha</title>
<style>
*{box-sizing:border-box;touch-action:manipulation}
body{margin:0;background:#102b26;color:#fff;font-family:system-ui,Arial,sans-serif;overflow:hidden;user-select:none}
button{font:inherit;cursor:pointer;border:0}
#game{position:relative;width:100vw;height:100dvh;max-width:1100px;margin:auto;overflow:hidden;background:#477c56}
canvas{display:block;width:100%;height:100%;touch-action:none}
#topbar{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:10px 13px;background:linear-gradient(#102b26eF,#102b2680,transparent);pointer-events:none}
.logo{font-size:13px;font-weight:950;letter-spacing:1px;text-shadow:0 2px 4px #000}
.logo span{color:#f4ce78}
.hud{display:flex;gap:7px}
.hud div{background:#102b26d9;border:1px solid #ffffff35;border-radius:10px;padding:5px 9px;text-align:center;font-size:9px;color:#dce9d8;min-width:49px}
.hud b{display:block;color:#f4ce78;font-size:14px}
#location{position:absolute;top:66px;left:13px;background:#102b26c9;border:1px solid #ffffff35;padding:7px 11px;border-radius:9px;font-size:11px;font-weight:800}
#controlLayer{position:absolute;bottom:18px;left:0;right:0;z-index:8;display:flex;justify-content:space-between;align-items:flex-end;padding:0 17px;pointer-events:none}
#joystick{width:142px;height:142px;border-radius:50%;background:#102b2670;border:2px solid #ffffff80;position:relative;pointer-events:auto;touch-action:none;box-shadow:0 4px 18px #0003}
#stick{position:absolute;width:59px;height:59px;left:39px;top:39px;border-radius:50%;background:linear-gradient(145deg,#f6e4ad,#d0a953);border:3px solid #fff7d9;box-shadow:0 4px 10px #0005;pointer-events:none}
.controlRight{display:flex;align-items:flex-end;gap:12px;pointer-events:auto}
.actionBtn{width:69px;height:69px;border-radius:50%;font-weight:950;color:#263c2d;background:linear-gradient(145deg,#f8df9b,#d3a64c);border:3px solid #fff1c9;box-shadow:0 5px 0 #8e6b30,0 6px 15px #0005;font-size:12px}
.actionBtn.jump{width:59px;height:59px;background:linear-gradient(145deg,#d7ebc1,#77a66c);border-color:#efffe5;box-shadow:0 5px 0 #426c43,0 6px 15px #0005}
.controlHint{position:absolute;bottom:165px;left:18px;font-size:10px;color:#fff;text-shadow:0 2px 4px #000;pointer-events:none}
#quickButtons{position:absolute;top:66px;right:12px;z-index:6;display:flex;gap:6px}
.quick{background:#102b26d9;color:white;border:1px solid #ffffff55;border-radius:10px;padding:8px 10px;font-size:11px;font-weight:850}
#toast{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);background:#102b26ed;border:1px solid #f4ce78;color:#fff;padding:13px 18px;border-radius:13px;font-size:13px;text-align:center;z-index:30;display:none;max-width:85%;box-shadow:0 8px 25px #0005}
#overlay{position:absolute;inset:0;background:#0b211bd9;z-index:20;display:none;align-items:center;justify-content:center;padding:16px}
.panel{background:#fff8e9;color:#253e31;border-radius:20px;padding:19px;width:min(520px,100%);max-height:85%;overflow:auto;box-shadow:0 15px 45px #0006}
.panel h2{margin:0 0 8px;font-size:22px}
.panel p{font-size:14px;line-height:1.55}
.panel small{color:#718477}
.close{float:right;background:#e6eadc;border-radius:9px;padding:7px 11px;color:#31523c;font-weight:900}
.primary{width:100%;background:#24563e;color:white;padding:13px;border-radius:12px;font-weight:900;margin-top:10px}
.secondary{background:#e5eddf;color:#31523c;padding:11px;border-radius:11px;font-weight:850}
.choice{width:100%;text-align:left;background:#f0f1e6;border:1px solid #dce3d5;color:#294234;padding:12px;border-radius:12px;margin:6px 0;font-weight:700;line-height:1.4}
.choice.correct{background:#dff0dc;border-color:#6ba46d}
.choice.wrong{background:#f7e4dc;border-color:#ce8977}
.choice:disabled{opacity:1}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}
.tile{background:#edf0e5;border:1px solid #dce4d6;border-radius:11px;padding:10px 5px;color:#31523c;font-weight:800;font-size:11px;text-align:center}
.tile.done{background:#dcebd9}
.tile.locked{opacity:.4}
.bar{height:9px;background:#dce4d8;border-radius:20px;overflow:hidden;margin:8px 0}
.bar span{height:100%;display:block;background:#76a86d;width:0}
#miniMap{position:absolute;right:13px;top:113px;width:110px;height:78px;border:2px solid #f4e8c3;border-radius:9px;background:#8bb38a;z-index:4;opacity:.9;pointer-events:none}
@media(max-width:390px){
 #joystick{width:124px;height:124px}
 #stick{left:32px;top:32px}
 .actionBtn{width:62px;height:62px}
 .actionBtn.jump{width:53px;height:53px}
 .controlHint{bottom:148px}
}
</style>
</head>
<body>
<div id="game">
 <canvas id="world"></canvas>

 <div id="topbar">
  <div class="logo">MISI PAHLAWAN <span>ALPHA</span></div>
  <div class="hud">
   <div>TAHAP<b id="level">1</b></div>
   <div>XP<b id="xp">0</b></div>
   <div>SYILING<b id="coins">0</b></div>
  </div>
 </div>

 <div id="location">🌿 KAMPUNG BORNEO</div>
 <div id="quickButtons">
  <button class="quick" onclick="openMap()">🗺️ PETA</button>
  <button class="quick" onclick="openBag()">🎒 BEG</button>
 </div>
 <canvas id="miniMap" width="220" height="156"></canvas>

 <div class="controlHint">GERAKKAN JOYSTICK UNTUK BERJALAN</div>
 <div id="controlLayer">
  <div id="joystick"><div id="stick"></div></div>
  <div class="controlRight">
   <button class="actionBtn jump" id="jumpBtn">LOMPAT</button>
   <button class="actionBtn" id="actionBtn">AKSI</button>
  </div>
 </div>
 <div id="toast"></div>

 <div id="overlay">
  <div class="panel" id="panelContent"></div>
 </div>
</div>

<script>
"use strict";

/* =========================================================
   MISI PAHLAWAN ALPHA — RPG 2D SENTUH
   Kawalan: joystick / WASD / anak panah, lompat, aksi.
   ========================================================= */

const canvas=document.getElementById("world");
const ctx=canvas.getContext("2d");
const mini=document.getElementById("miniMap");
const mctx=mini.getContext("2d");

const heroes=[
 {name:"Arnab",title:"Wira Lincah",emoji:"🐰"},
 {name:"Hamster",title:"Wira Ketahanan",emoji:"🐹"},
 {name:"Kucing",title:"Wira Ketangkasan",emoji:"🐱"},
 {name:"Cenderawasih",title:"Wira Udara",emoji:"🦜"},
 {name:"Kijang",title:"Wira Kepantasan",emoji:"🦌"}
];

const themes=[
"Jejak Kampung","Sahabat Baharu","Sungai Bersih","Amanah Kecil","Hati Penyayang",
"Berani Mencuba","Bekerja Bersama","Pemimpin Muda","Jiran Prihatin","Bijak Memilih",
"Warisan Borneo","Ilmu dan Usaha","Keselamatan Jalan","Menjaga Haiwan","Tanggungjawab Diri",
"Bersikap Jujur","Mengurus Emosi","Saling Menghormati","Bijak Berkomunikasi","Semangat Kesukarelawanan",
"Alam dan Kehidupan","Cermat Menggunakan","Menyelesaikan Masalah","Berdisiplin","Berkongsi Rezeki",
"Menjaga Kemudahan","Kesihatan Diri","Berfikiran Terbuka","Menghargai Pekerja","Bertindak Selamat",
"Membina Keyakinan","Mengurus Wang","Saling Membantu","Menjaga Kebersihan","Menghormati Perbezaan",
"Mencari Ilmu","Berjiwa Pemimpin","Menghargai Masa","Bersedia Membantu","Bijak Menggunakan Teknologi",
"Menjaga Kepercayaan","Bersatu Hati","Cinta Negara","Menghargai Pengorbanan","Menyebarkan Kebaikan",
"Ujian Ketabahan","Wira Berbakti"
];

const places=[
"Kampung Borneo","Sekolah","Tebing sungai","Rumah panjang","Kawasan kampung",
"Laluan hutan","Dewan kampung","Padang sekolah","Kejiranan","Pasar tamu",
"Rumah panjang","Pusat bacaan","Jalan kampung","Kebun kampung","Rumah",
"Sekolah","Padang permainan","Kampung","Balai komuniti","Kawasan kampung",
"Hutan Borneo","Kedai kampung","Sekolah","Pusat aktiviti","Kampung",
"Kemudahan awam","Padang kampung","Sekolah","Pasar tamu","Laluan sungai",
"Dewan sekolah","Pasar kampung","Rumah panjang","Kawasan awam","Kampung",
"Perpustakaan","Aktiviti kumpulan","Rumah","Kampung","Pusat pembelajaran",
"Sekolah","Kampung","Komuniti","Rumah panjang","Kampung","Laluan pengembaraan","Borneo"
];

const daily=[
 {
  title:"Membantu seseorang",trait:"Penyayang",icon:"💚",
  story:"Di {place}, kamu ternampak seseorang memerlukan bantuan. Apakah tindakan terbaik?",
  options:[
   ["Berpura-pura tidak nampak.",false],
   ["Tawarkan bantuan dengan sopan mengikut kemampuan.",true],
   ["Menyuruh orang lain tanpa menghiraukan keadaan.",false]
  ],
  lesson:"Sikap penyayang bermula dengan keprihatinan terhadap orang lain."
 },
 {
  title:"Menunaikan amanah",trait:"Berdaya Tahan",icon:"🛡️",
  story:"Kamu diberikan satu tanggungjawab berkaitan {theme}. Tiada sesiapa memeriksa tugas kamu. Apakah pilihan terbaik?",
  options:[
   ["Laksanakan tugas dengan jujur dan bersungguh-sungguh.",true],
   ["Abaikan kerana tiada orang melihat.",false],
   ["Buat sekadar melepaskan tanggungjawab.",false]
  ],
  lesson:"Amanah perlu ditunaikan walaupun tanpa pujian atau pengawasan."
 },
 {
  title:"Memimpin dengan baik",trait:"Berupaya Memimpin",icon:"🧭",
  story:"Dalam aktiviti {theme}, ahli kumpulan mempunyai pandangan berbeza. Apakah tindakan pemimpin yang baik?",
  options:[
   ["Paksa semua orang ikut kehendak sendiri.",false],
   ["Tidak mahu mendengar pandangan sesiapa.",false],
   ["Dengar pandangan semua dan buat keputusan secara adil.",true]
  ],
  lesson:"Pemimpin yang baik mendengar, berlaku adil dan menunjukkan teladan."
 },
 {
  title:"Menjaga kepentingan bersama",trait:"Warganegara Aktif",icon:"🌏",
  story:"Kamu menyedari satu masalah di {place} yang boleh menjejaskan orang ramai. Apakah tindakan terbaik?",
  options:[
   ["Biarkan kerana bukan urusan sendiri.",false],
   ["Ambil tindakan selamat atau laporkan kepada pihak bertanggungjawab.",true],
   ["Menyalahkan orang lain tanpa membantu.",false]
  ],
  lesson:"Warganegara aktif mengambil berat tentang kesejahteraan masyarakat."
 },
 {
  title:"Menghadapi kesukaran",trait:"Berdaya Tahan",icon:"💪",
  story:"Ketika menjalankan aktiviti {theme}, rancangan kamu tidak menjadi. Apakah tindakan terbaik?",
  options:[
   ["Berhenti terus dan menyalahkan orang lain.",false],
   ["Terus mencuba tanpa memikirkan cara yang lebih sesuai.",false],
   ["Tenangkan diri, belajar daripada kesilapan dan cuba lagi.",true]
  ],
  lesson:"Ketabahan bermaksud sanggup belajar dan bangkit semula selepas kegagalan."
 }
];

const KEY="mpalpha_full_v2";
function blankSave(){
 return {hero:0,xp:0,coins:0,done:[],traits:{
  "Penyayang":0,"Berdaya Tahan":0,"Berupaya Memimpin":0,"Warganegara Aktif":0
 }};
}
function loadSave(){
 try{
  const d=JSON.parse(localStorage.getItem(KEY));
  if(d&&Array.isArray(d.done))return {...blankSave(),...d};
 }catch(e){}
 return blankSave();
}
let save=loadSave();
function persist(){
 try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}
}

const player={
 x:480,y:700,vx:0,vy:0,speed:210,
 jump:0,jumpV:0,face:1,
 moving:false
};
const world={w:1900,h:1450};
let camera={x:0,y:0};
let W=innerWidth,H=innerHeight,DPR=1;
let lastTime=0;
let joystick={x:0,y:0,active:false,pointer:null};
let keys={};
let currentMission=-1;
let missionAnswered=false;
let npc={x:1120,y:560};
let marker={x:800,y:850};
let nearAction=false;
let toastTimer=null;
let sceneTime=0;

/* Dunia dan peta */
function resize(){
 W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
 ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize);resize();

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function level(){return Math.floor(save.xp/100)+1}
function nextMission(){for(let i=0;i<230;i++)if(!save.done.includes(i))return i;return 229}
function completed(id){return save.done.includes(id)}
function hero(){return heroes[save.hero]||heroes[0]}
function say(s){
 const el=document.getElementById("toast");
 el.textContent=s;el.style.display="block";
 clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.display="none",2200);
}
function hud(){
 document.getElementById("level").textContent=level();
 document.getElementById("xp").textContent=save.xp;
 document.getElementById("coins").textContent=save.coins;
}

/* Lukisan dunia */
function ellipse(x,y,rx,ry,color){
 ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill();
}
function tree(x,y,s=1){
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);
 ctx.fillStyle="#684b34";ctx.fillRect(-9,-92,18,95);
 ctx.strokeStyle="#684b34";ctx.lineWidth=8;
 ctx.beginPath();ctx.moveTo(0,-52);ctx.lineTo(-36,-95);ctx.moveTo(0,-40);ctx.lineTo(37,-90);ctx.stroke();
 ellipse(-30,-111,43,34,"#286447");
 ellipse(14,-132,52,42,"#225b40");
 ellipse(48,-103,38,33,"#34734a");
 ellipse(-2,-96,43,32,"#3d8050");
 ellipse(-18,-137,18,13,"#70a86b");
 ellipse(28,-147,19,13,"#73aa70");
 ctx.restore();
}
function drawGround(){
 ctx.fillStyle="#568957";ctx.fillRect(0,0,world.w,world.h);
 // tompok cahaya
 for(let i=0;i<45;i++){
  const x=(i*239+70)%world.w,y=(i*173+60)%world.h;
  ellipse(x,y,30+(i%4)*9,12+(i%3)*7,i%2?"#63945a":"#4c8251");
 }
 // sungai berliku
 ctx.beginPath();
 ctx.moveTo(0,210);ctx.bezierCurveTo(430,80,480,400,850,360);
 ctx.bezierCurveTo(1190,330,1280,110,1600,190);
 ctx.bezierCurveTo(1730,220,1810,330,1900,350);
 ctx.lineTo(1900,480);
 ctx.bezierCurveTo(1740,460,1650,320,1550,300);
 ctx.bezierCurveTo(1240,220,1150,470,840,455);
 ctx.bezierCurveTo(490,500,420,210,0,330);ctx.closePath();
 const water=ctx.createLinearGradient(0,180,0,480);
 water.addColorStop(0,"#74b8a9");water.addColorStop(1,"#327f7d");
 ctx.fillStyle=water;ctx.fill();
 ctx.strokeStyle="#b9e4d1";ctx.lineWidth=5;
 for(let i=0;i<10;i++){
  ctx.beginPath();ctx.moveTo(i*180,270+(i%3)*30);ctx.lineTo(i*180+70,264+(i%3)*30);ctx.stroke();
 }
 // jalan tanah
 ctx.strokeStyle="#bca477";ctx.lineWidth=100;ctx.lineCap="round";
 ctx.beginPath();ctx.moveTo(300,1300);ctx.bezierCurveTo(500,1080,700,1090,800,850);
 ctx.bezierCurveTo(930,600,1050,700,1120,560);
 ctx.bezierCurveTo(1240,360,1450,450,1600,350);ctx.stroke();
 ctx.strokeStyle="#d8c69b";ctx.lineWidth=5;
 ctx.beginPath();ctx.moveTo(300,1300);ctx.bezierCurveTo(500,1080,700,1090,800,850);
 ctx.bezierCurveTo(930,600,1050,700,1120,560);ctx.stroke();
 // kawasan rumput
 for(let i=0;i<100;i++){
  let x=(i*191+30)%world.w,y=(i*277+20)%world.h;
  ctx.strokeStyle=i%2?"#a5c37c":"#8bad6b";ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-5,y-10);ctx.moveTo(x,y);ctx.lineTo(x+5,y-13);ctx.stroke();
 }
}
function drawHouse(x,y,s=1){
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);
 // bayang
 ellipse(0,8,135,25,"#254d3c55");
 // tiang
 ctx.fillStyle="#77553b";
 for(let i=-90;i<=90;i+=60)ctx.fillRect(i, -55,9,90);
 // badan
 ctx.fillStyle="#a9784b";ctx.fillRect(-115,-125,230,75);
 ctx.fillStyle="#d0a16b";ctx.fillRect(-105,-115,210,55);
 ctx.strokeStyle="#714a31";ctx.lineWidth=5;
 for(let i=-85;i<=85;i+=55){
  ctx.fillStyle="#e8d09c";ctx.fillRect(i,-103,27,28);
  ctx.strokeRect(i,-103,27,28);
 }
 // bumbung
 ctx.fillStyle="#664b37";
 ctx.beginPath();ctx.moveTo(-140,-125);ctx.lineTo(-90,-205);ctx.lineTo(90,-205);ctx.lineTo(140,-125);ctx.closePath();ctx.fill();
 ctx.strokeStyle="#c89d68";ctx.lineWidth=5;ctx.stroke();
 ctx.restore();
}
function drawWorld(){
 ctx.save();ctx.translate(-camera.x,-camera.y);
 drawGround();
 // pokok latar
 for(let i=0;i<42;i++){
  const x=(i*347+30)%world.w;
  const y=(i*211+30)%world.h;
  tree(x,y,0.7+(i%4)*.16);
 }
 // rumah panjang
 drawHouse(1280,500,1.05);
 drawHouse(440,1080,.72);
 // batu sungai
 for(let i=0;i<22;i++){
  const x=(i*151+40)%world.w,y=200+(i*67)%290;
  ellipse(x,y,12,7,"#829b83");
 }
 // penanda misi
 const pulse=1+Math.sin(sceneTime*3)*.12;
 ctx.save();ctx.translate(marker.x,marker.y);
 ellipse(0,10,33*pulse,12*pulse,"#f4d47a77");
 ctx.strokeStyle="#ffe7a2";ctx.lineWidth=4;
 ctx.beginPath();ctx.arc(0,0,22*pulse,0,Math.PI*2);ctx.stroke();
 ctx.fillStyle="#fff1bd";ctx.font="bold 24px system-ui";ctx.textAlign="center";ctx.fillText("!",0,8);
 ctx.restore();
 // NPC kampung
 drawNPC(npc.x,npc.y);
 // pemain
 drawPlayer();
 // sempadan visual
 ctx.restore();
}
function drawNPC(x,y){
 ctx.save();ctx.translate(x,y);
 ellipse(0,13,22,8,"#183c2c55");
 ctx.fillStyle="#e3b77e";ctx.beginPath();ctx.arc(0,-30,14,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#376c54";ctx.fillRect(-15,-16,30,30);
 ctx.fillStyle="#503b2c";ctx.fillRect(-12,-2,9,17);ctx.fillRect(3,-2,9,17);
 ctx.fillStyle="#f1d99d";ctx.font="bold 11px system-ui";ctx.textAlign="center";ctx.fillText("PENDUDUK",0,-56);
 ctx.restore();
}
function drawPlayer(){
 const h=hero();
 ctx.save();ctx.translate(player.x,player.y-player.jump);
 ellipse(0,17,22,9,"#183c2c66");
 ctx.font="48px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";
 ctx.fillText(h.emoji,0,-8);
 if(player.moving){
  ctx.strokeStyle="#f3d78e";ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(0,-8,31,Math.PI*1.1,Math.PI*1.9);ctx.stroke();
 }
 ctx.restore();
}
function drawMiniMap(){
 mctx.clearRect(0,0,220,156);
 mctx.fillStyle="#65966b";mctx.fillRect(0,0,220,156);
 mctx.strokeStyle="#75c2b2";mctx.lineWidth=24;
 mctx.beginPath();mctx.moveTo(0,40);mctx.quadraticCurveTo(80,5,110,65);mctx.quadraticCurveTo(155,120,220,75);mctx.stroke();
 mctx.strokeStyle="#c5ad7d";mctx.lineWidth=10;
 mctx.beginPath();mctx.moveTo(35,140);mctx.quadraticCurveTo(75,90,100,85);mctx.quadraticCurveTo(140,65,180,35);mctx.stroke();
 mctx.fillStyle="#f7d47c";mctx.beginPath();mctx.arc(marker.x/world.w*220,marker.y/world.h*156,6,0,Math.PI*2);mctx.fill();
 mctx.fillStyle="#fff";mctx.beginPath();mctx.arc(player.x/world.w*220,player.y/world.h*156,6,0,Math.PI*2);mctx.fill();
}

/* Gerakan dan kamera */
function update(dt){
 sceneTime+=dt;
 let ax=joystick.x,ay=joystick.y;
 if(keys.ArrowLeft||keys.a)ax-=1;
 if(keys.ArrowRight||keys.d)ax+=1;
 if(keys.ArrowUp||keys.w)ay-=1;
 if(keys.ArrowDown||keys.s)ay+=1;
 const mag=Math.hypot(ax,ay);
 if(mag>1){ax/=mag;ay/=mag}
 player.vx=ax*player.speed;player.vy=ay*player.speed;
 player.moving=mag>.12;
 if(ax!==0)player.face=Math.sign(ax);
 player.x=clamp(player.x+player.vx*dt,40,world.w-40);
 player.y=clamp(player.y+player.vy*dt,80,world.h-40);
 if(player.jump>0||player.jumpV>0){
  player.jump+=player.jumpV*dt;
  player.jumpV-=720*dt;
  if(player.jump<0){player.jump=0;player.jumpV=0}
 }
 camera.x=clamp(player.x-W/2,0,world.w-W);
 camera.y=clamp(player.y-H/2,0,world.h-H);
 nearAction=dist(player,marker)<105||dist(player,npc)<105;
 document.getElementById("actionBtn").style.filter=nearAction?"brightness(1.15)":"";
 document.getElementById("actionBtn").textContent=nearAction?"AKSI!":"AKSI";
}
function frame(t){
 const dt=Math.min((t-lastTime)/1000||0,.04);lastTime=t;
 update(dt);
 ctx.clearRect(0,0,W,H);
 drawWorld();drawMiniMap();
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* Kawalan joystick sentuh */
const joy=document.getElementById("joystick");
const stick=document.getElementById("stick");
function joyMove(e){
 const r=joy.getBoundingClientRect();
 let x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2);
 const max=r.width*.34,len=Math.hypot(x,y);
 if(len>max){x=x/len*max;y=y/len*max}
 joystick.x=x/max;joystick.y=y/max;
 stick.style.transform=`translate(${x}px,${y}px)`;
}
function joyEnd(){
 joystick.x=0;joystick.y=0;joystick.active=false;
 stick.style.transform="translate(0,0)";
}
joy.addEventListener("pointerdown",e=>{
 e.preventDefault();joystick.active=true;joy.setPointerCapture(e.pointerId);joyMove(e);
});
joy.addEventListener("pointermove",e=>{if(joystick.active)joyMove(e)});
joy.addEventListener("pointerup",joyEnd);
joy.addEventListener("pointercancel",joyEnd);
joy.addEventListener("lostpointercapture",joyEnd);

/* Butang lompat dan aksi */
document.getElementById("jumpBtn").addEventListener("pointerdown",e=>{
 e.preventDefault();
 if(player.jump===0&&player.jumpV===0)player.jumpV=330;
});
document.getElementById("actionBtn").addEventListener("click",action);
addEventListener("keydown",e=>{
 keys[e.key]=true;
 if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();
 if(e.key===" "){if(player.jump===0&&player.jumpV===0)player.jumpV=330}
 if(e.key==="e"||e.key==="E")action();
 if(e.key==="m"||e.key==="M")openMap();
});
addEventListener("keyup",e=>keys[e.key]=false);

/* Misi */
function missionData(id){
 const w=Math.floor(id/5),d=id%5,t=daily[d];
 return {
  id,w,d,title:t.title,trait:t.trait,icon:t.icon,
  story:t.story.replaceAll("{place}",places[w]).replaceAll("{theme}",themes[w]),
  options:t.options,lesson:t.lesson
 };
}
function action(){
 if(!nearAction){
  say("Dekati penanda misi atau penduduk kampung untuk berinteraksi.");
  return;
 }
 const id=nextMission();
 if(save.done.length>=230){openBag();say("Semua misi telah selesai!");return}
 openMission(id);
}
function openOverlay(html){
 document.getElementById("panelContent").innerHTML=html;
 document.getElementById("overlay").style.display="flex";
}
function closeOverlay(){
 document.getElementById("overlay").style.display="none";
}
function openMission(id){
 currentMission=id;missionAnswered=false;
 const m=missionData(id);
 openOverlay(`
  <button class="close" onclick="closeOverlay()">✕</button>
  <small>MINGGU ${m.w+1} · HARI ${m.d+1} · MISI ${id+1}/230</small>
  <h2>${m.icon} ${m.title}</h2>
  <p>${m.story}</p>
  <p><b>Apakah tindakan kamu, Wira?</b></p>
  <div id="missionChoices">
   ${m.options.map((o,i)=>`<button class="choice" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${o[0]}</button>`).join("")}
  </div>
  <div id="missionFeedback"></div>
  <button id="continueBtn" class="primary" style="display:none" onclick="finishMission()">KEMBALI KE PENGEMBARAAN</button>
 `);
}
function answer(index){
 if(missionAnswered)return;
 missionAnswered=true;
 const m=missionData(currentMission);
 const good=m.options[index][1];
 const first=!completed(currentMission);
 const xp=good?10:3;
 const buttons=[...document.querySelectorAll("#missionChoices button")];
 buttons.forEach((b,i)=>{
  b.disabled=true;
  if(m.options[i][1])b.classList.add("correct");
  else if(i===index)b.classList.add("wrong");
 });
 if(first){
  save.done.push(currentMission);
  save.xp+=xp;save.coins+=good?5:2;
  save.traits[m.trait]=(save.traits[m.trait]||0)+(good?2:1);
  persist();hud();
 }
 document.getElementById("missionFeedback").innerHTML=`
  <p style="background:${good?"#e0efdb":"#f3ead5"};padding:12px;border-radius:11px">
  <b>${good?"🌟 Syabas, Wira!":"🌱 Terus belajar, Wira."}</b><br>
  ${m.lesson}<br><br>
  <b>Ganjaran: ${first?"+"+xp+" XP · "+(good?5:2)+" syiling":"Misi sudah direkod sebelum ini"}</b>
  </p>`;
 document.getElementById("continueBtn").style.display="block";
}
function finishMission(){
 closeOverlay();
 if(save.done.length>=230){say("Tahniah! Semua 230 misi selesai.");return}
 const id=nextMission();
 const w=Math.floor(id/5);
 marker.x=800+(w%5)*120;
 marker.y=850-(w%4)*100;
 say("Misi direkod! Teruskan perjalanan ke penanda seterusnya.");
}

/* Peta, beg dan menu */
function openMap(){
 const done=save.done.length;
 let html=`<button class="close" onclick="closeOverlay()">✕</button>
 <small>PETA PENGEMBARAAN</small><h2>🗺️ Jejak Wira Borneo</h2>
 <p>Kemajuan: <b>${done}/230 misi</b></p>
 <div class="bar"><span style="width:${done/230*100}%"></span></div>
 <div class="grid">`;
 themes.forEach((name,i)=>{
  const count=[0,1,2,3,4].filter(d=>completed(i*5+d)).length;
  const locked=i*5>nextMission()&&!count;
  html+=`<div class="tile ${count===5?"done":""} ${locked?"locked":""}">
   Minggu ${i+1}<br>${count===5?"✓ ":""}${name}<br><small>${count}/5 misi</small>
  </div>`;
 });
 html+=`</div><button class="primary" onclick="closeOverlay()">KEMBALI KE DUNIA</button>`;
 openOverlay(html);
}
function openBag(){
 const done=save.done.length;
 const traitNames=["Penyayang","Berdaya Tahan","Berupaya Memimpin","Warganegara Aktif"];
 let html=`<button class="close" onclick="closeOverlay()">✕</button>
 <small>STATUS WIRA</small><h2>🎒 Beg Pengembaraan</h2>
 <p>${hero().emoji} <b>${hero().name} — ${hero().title}</b></p>
 <div class="grid">
  <div class="tile">⭐ XP<br>${save.xp}</div>
  <div class="tile">🪙 Syiling<br>${save.coins}</div>
  <div class="tile">🏅 Tahap<br>${level()}</div>
 </div>
 <p><b>Kemajuan misi ${done}/230</b></p><div class="bar"><span style="width:${done/230*100}%"></span></div>
 <h3>Nilai karakter</h3>`;
 traitNames.forEach(n=>{
  html+=`<p style="margin:7px 0;font-size:13px"><b>${n}</b> — ${save.traits[n]||0} mata</p>`;
 });
 html+=`<p><small>Permainan disimpan secara automatik pada peranti ini.</small></p>
 <button class="secondary" onclick="downloadSave()">SIMPAN SALINAN</button>
 <button class="secondary" onclick="resetGame()" style="margin-left:5px">RESET</button>
 <button class="primary" onclick="closeOverlay()">KEMBALI KE DUNIA</button>`;
 openOverlay(html);
}
function downloadSave(){
 const blob=new Blob([JSON.stringify(save,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");a.href=url;a.download="Misi-Pahlawan-Alpha-save.json";a.click();
 URL.revokeObjectURL(url);
 say("Salinan simpanan disediakan.");
}
function resetGame(){
 if(confirm("Padam semua kemajuan permainan?")){
  save=blankSave();persist();hud();closeOverlay();
  player.x=480;player.y=700;marker.x=800;marker.y=850;
  say("Permainan dimulakan semula.");
 }
}

/* Pemilihan wira — tekan butang W pada papan kekunci */
function chooseHero(){
 let html=`<button class="close" onclick="closeOverlay()">✕</button>
 <small>PILIH WIRA</small><h2>🐾 Pilih teman pengembaraan</h2><div class="grid">`;
 heroes.forEach((h,i)=>{
  html+=`<button class="tile" onclick="setHero(${i})" style="font-size:14px">${h.emoji}<br>${h.name}<br><small>${h.title}</small></button>`;
 });
 html+=`</div><button class="primary" onclick="closeOverlay()">KEMBALI</button>`;
 openOverlay(html);
}
function setHero(i){save.hero=i;persist();closeOverlay();say(hero().name+" menjadi wira pilihan kamu.");}

/* Lokasi dan maklum balas */
function updateLocation(){
 const d=dist(player,npc);
 const el=document.getElementById("location");
 if(dist(player,marker)<110)el.textContent="✨ PENANDA MISI — TEKAN AKSI";
 else if(d<110)el.textContent="👋 PENDUDUK KAMPUNG — TEKAN AKSI";
 else if(player.y<420)el.textContent="🌊 TEPI SUNGAI BORNEO";
 else if(player.y>1000)el.textContent="🌳 LALUAN HUTAN";
 else el.textContent="🌿 KAMPUNG BORNEO";
}
const oldUpdate=update;
update=function(dt){oldUpdate(dt);updateLocation()};

/* Interaksi tambahan */
document.getElementById("location").addEventListener("click",chooseHero);
hud();
</script>
