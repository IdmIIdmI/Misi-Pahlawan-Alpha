<style>
:root{--gold:#ffd65a;--green:#174d38;--dark:#102d25;--cream:#fff7df}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;color:white;background:#050e0b;min-height:100vh;overflow:hidden}
button,input,textarea,select{font:inherit}
button{border:0;border-radius:12px;padding:12px 17px;font-weight:bold;cursor:pointer;transition:all 0.2s}
button:hover{transform:translateY(-2px);filter:brightness(1.1)}
button:disabled{opacity:.5;cursor:not-allowed;transform:none}
.primary{background:linear-gradient(135deg,#ffdb63,#f5ad18);color:#392b08;box-shadow:0 4px 15px rgba(255,214,90,0.4);border:1px solid #fff}
.secondary{background:#286c50;color:white}
.small{padding:8px 12px;font-size:12px}
.hidden{display:none!important}
.screen{min-height:100vh;padding:18px;position:relative;z-index:10;overflow-y:auto}
.panel{width:min(700px,100%);margin:20px auto;background:rgba(255,247,223,0.95);backdrop-filter:blur(10px);color:#24382b;padding:22px;border-radius:22px;box-shadow:0 12px 35px #000c}
.panel h1,.panel h2{margin-top:0;color:#102d25}
.brand{text-align:center;color:var(--gold);font-weight:1000;font-size:clamp(27px,7vw,48px);letter-spacing:1px;text-shadow:3px 4px #713d16}
.field{margin:12px 0}
.field label{display:block;font-weight:bold;margin-bottom:6px}
.field input{width:100%;border:2px solid #d6d0b8;border-radius:10px;padding:12px;background:white;color:#172d22}
.row{display:flex;gap:9px;flex-wrap:wrap}
.row>*{flex:1}
.notice{padding:12px;background:#fff0bd;color:#5c4612;border-radius:10px;margin:12px 0;font-size:14px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;background:rgba(16,45,37,0.85);backdrop-filter:blur(8px);border-bottom:2px solid #e7b94b;position:absolute;top:0;left:0;right:0;z-index:20}
.stat{background:#235b40;padding:8px 12px;border-radius:12px;font-weight:bold;font-size:13px}
#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:rgba(16,45,37,0.95);color:white;padding:14px 24px;border-radius:30px;z-index:100;display:none;border:1px solid var(--gold);box-shadow:0 8px 25px rgba(0,0,0,0.5)}

/* SKRIN PEMBUKAAN */
#openingScreen{padding:0;overflow:hidden;position:relative;min-height:100vh;background:#071b17}
.opening-content{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.opening-title{font-size:clamp(35px,9vw,76px);font-weight:1000;color:#ffe06a;text-shadow:0 4px #9b501a,0 8px 25px #000;margin:18px auto}

/* PEMILIHAN HERO MLBB 3D */
#characterScreen{background:radial-gradient(circle at top,#4a9b76,#102d25 75%)}
.character-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:15px 0}
.character-card{background:linear-gradient(145deg,#fff9e5,#dbe9ce);color:#203d2c;border:3px solid transparent;border-radius:14px;padding:8px 4px;text-align:center;cursor:pointer}
.character-card.selected{border-color:#ffbd31;transform:translateY(-4px);box-shadow:0 0 0 3px #fff4a0}
.character-preview-3d{width:100%;height:230px;border-radius:18px;overflow:hidden;background:radial-gradient(circle,#1a4d3b,#0a2118);margin-bottom:15px;box-shadow:inset 0 0 25px #0008}

/* DUNIA PERMAINAN MOBA 3D */
#gameScreen{padding:0;overflow:hidden;position:relative;width:100vw;height:100vh}
#webgl-container{width:100%;height:100%;position:absolute;inset:0;z-index:1}
.world-title-3d{position:absolute;top:65px;left:50%;transform:translateX(-50%);color:#fff;text-shadow:2px 2px 8px #000;font-weight:bold;z-index:10;font-size:16px;background:rgba(0,0,0,0.5);padding:6px 20px;border-radius:20px;border:1px solid rgba(255,255,255,0.2)}

.controls{position:absolute;bottom:25px;left:25px;z-index:15;display:grid;grid-template-columns:52px 52px 52px;grid-template-rows:52px 52px;gap:6px}
.controls button{padding:0;background:rgba(21,62,49,0.85);color:white;border:2px solid #ffe18a;font-size:22px;border-radius:14px}
.interact{position:absolute;right:25px;bottom:25px;z-index:15;background:linear-gradient(135deg,#ffdb63,#f5ad18);color:#392a0b;padding:16px 26px;font-size:15px;border-radius:18px;font-weight:bold;box-shadow:0 6px 20px rgba(245,173,24,0.5)}

.mission-modal,.map-modal{position:absolute;inset:0;z-index:30;background:rgba(4,15,11,0.85);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:15px}
.mission-card,.map-card{background:#fff7df;color:#23382b;border-radius:24px;width:min(580px,100%);max-height:90vh;overflow-y:auto;padding:24px;border:2px solid #ffe18a}
.option{display:block;width:100%;text-align:left;margin:10px 0;background:#e7eddb;color:#203b2c;border:2px solid #c6d5b9;padding:14px;border-radius:14px;font-weight:bold}
.feedback{padding:14px;border-radius:14px;margin-top:12px;font-size:14px}
.good{background:#d5f0d4;color:#17532c}.bad{background:#ffe0d9;color:#7d241b}
.map-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}
.destination{width:100%;min-height:95px;text-align:left;padding:12px;background:#e5eedc;color:#23432e;border:3px solid #c5d5b9;border-radius:16px}
.destination.locked{opacity:.5;background:#ddd}
.destination.current{border-color:#e5a600;background:#fff0bc}

<script>
const SUPABASE_URL="https://krijvnbpbmqqyquzzrxu.supabase.co";
const SUPABASE_KEY="sb_publishable_NRa91_nx4Xc2PSvUoiCWWw_zgf3xJha";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let currentUser=null,missions=[],progressRows=[],currentMission=null;
let balance=0,remainingSeconds=900,authMode="login",selectedCharacter="hamster",currentArea=0;

const $=id=>document.getElementById(id);

const characters=[
 {id:"hamster",name:"Hamster",tag:"Si Comel Berani",body:0xd99a54,armor:0xffb700,cloth:0xe7a82e},
 {id:"tupai",name:"Tupai",tag:"Si Pantas Tangkas",body:0xb96d39,armor:0x228b22,cloth:0x4c9c77},
 {id:"kucing",name:"Kucing",tag:"Si Bijak Ceria",body:0xa8b6c0,armor:0xd14747,cloth:0xe36b67},
 {id:"arnab",name:"Arnab",tag:"Si Lincah Mesra",body:0xe8d9c6,armor:0x8a2be2,cloth:0x8a73c8},
 {id:"kijang",name:"Kijang",tag:"Si Gagah Wibawa",body:0xbd8953,armor:0x008b8b,cloth:0x328c91}
];

const areas=[
 {id:"village",name:"Kampung Permulaan",icon:"🏡",bgColor:0x7ec0ee,groundColor:0x3a8e3d,unlock:0},
 {id:"forest",name:"Hutan Rimba",icon:"🌳",bgColor:0x1b4d3e,groundColor:0x1a5e20,unlock:2},
 {id:"waterfall",name:"Lembah Air Terjun",icon:"🏞️",bgColor:0x4682b4,groundColor:0x2e8b57,unlock:4},
 {id:"longhouse",name:"Rumah Panjang",icon:"🛖",bgColor:0xd2b48c,groundColor:0x8b4513,unlock:6},
 {id:"cave",name:"Gua Batu Kapur",icon:"⛰️",bgColor:0x1a1a2e,groundColor:0x2b2b2b,unlock:7}
];

function toast(m){const e=$("toast");e.textContent=m;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",3000)}
function showScreen(id){["openingScreen","authScreen","characterScreen","introScreen","gameScreen"].forEach(x=>$(x).classList.add("hidden"));$(id).classList.remove("hidden")}

/* ==================== THREE.JS MLBB GRAPHIC ENGINE ==================== */
let scene, camera, renderer, player3DGroup, terrainMesh, previewScene, previewCamera, previewRenderer, previewPlayerGroup;
let playerTargetPos = { x: 0, z: 0 }, playerPos = { x: 0, z: 0 }, playerRotation = 0;
let magicParticles = [];

function init3DEngine() {
 const container = $("webgl-container");
 scene = new THREE.Scene();
 scene.background = new THREE.Color(areas[0].bgColor);
 scene.fog = new THREE.FogExp2(areas[0].bgColor, 0.015);

 // Kamera Isometric Gaya MOBA / Mobile Legends
 camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 1000);
 camera.position.set(0, 18, 22);

 renderer = new THREE.WebGLRenderer({ antialias: true });
 renderer.setSize(window.innerWidth, window.innerHeight);
 renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
 renderer.shadowMap.enabled = true;
 renderer.shadowMap.type = THREE.PCFSoftShadowMap;
 container.appendChild(renderer.domElement);

 setupMLBBLighting();
 createMLBBTerrain();
 createPlayer3DModel();
 buildVFXParticles();
 buildEnvironmentObjects();

 window.addEventListener("resize", onWindowResize);
 animate3D();
}

function setupMLBBLighting() {
 const ambient = new THREE.AmbientLight(0xffffff, 0.85);
 scene.add(ambient);

 const sun = new THREE.DirectionalLight(0xfff5cc, 1.3);
 sun.position.set(15, 25, 15);
 sun.castShadow = true;
 sun.shadow.mapSize.width = 2048;
 sun.shadow.mapSize.height = 2048;
 scene.add(sun);
}

function createMLBBTerrain() {
 const geo = new THREE.PlaneGeometry(100, 100);
 const mat = new THREE.MeshToonMaterial({ color: areas[0].groundColor });
 terrainMesh = new THREE.Mesh(geo, mat);
 terrainMesh.rotation.x = -Math.PI / 2;
 terrainMesh.receiveShadow = true;
 scene.add(terrainMesh);
}

/* PEMBINAAN HERO STYLE MLBB (TOON SHADED & HERO ARMOR) */
function createMLBBHero3D(charId) {
 const c = characters.find(x => x.id === charId) || characters[0];
 const heroGroup = new THREE.Group();
 heroGroup.scale.set(0.5, 0.5, 0.5);

 // Material Gaya Cartoon MLBB (MeshToonMaterial)
 const bodyMat = new THREE.MeshToonMaterial({ color: c.body });
 const armorMat = new THREE.MeshToonMaterial({ color: c.armor });
 const clothMat = new THREE.MeshToonMaterial({ color: c.cloth });

 // Badan Utama
 const body = new THREE.Mesh(new THREE.SphereGeometry(0.75, 24, 24), bodyMat);
 body.position.y = 0.85; body.castShadow = true;
 heroGroup.add(body);

 // Perisai Dada (Hero Armor)
 const chestArmor = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.7, 0.6, 16), armorMat);
 chestArmor.position.y = 0.8; chestArmor.castShadow = true;
 heroGroup.add(chestArmor);

 // Perisai Bahu MLBB (Pauldrons)
 const shoulderL = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), armorMat);
 shoulderL.position.set(-0.75, 1.1, 0);
 const shoulderR = shoulderL.clone(); shoulderR.position.x = 0.75;
 heroGroup.add(shoulderL); heroGroup.add(shoulderR);

 // Kepala Chibi MLBB
 const head = new THREE.Mesh(new THREE.SphereGeometry(0.85, 32, 32), bodyMat);
 head.position.y = 1.8; head.castShadow = true;
 heroGroup.add(head);

 // Topi / Mahkota Pahlawan
 const crown = new THREE.Mesh(new THREE.ConeGeometry(0.5, 0.6, 8), armorMat);
 crown.position.y = 2.6; crown.rotation.x = -0.2;
 heroGroup.add(crown);

 // Mata Hero Bercahaya
 const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
 const pupilMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
 
 const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.14, 16, 16), eyeMat);
 eyeL.position.set(-0.28, 1.9, 0.72);
 const pupilL = new THREE.Mesh(new THREE.SphereGeometry(0.07, 16, 16), pupilMat);
 pupilL.position.set(-0.28, 1.9, 0.82);

 const eyeR = eyeL.clone(); eyeR.position.x = 0.28;
 const pupilR = pupilL.clone(); pupilR.position.x = 0.28;
 heroGroup.add(eyeL); heroGroup.add(pupilL);
 heroGroup.add(eyeR); heroGroup.add(pupilR);

 // Telinga Haiwan Pahlawan
 const earL = new THREE.Mesh(new THREE.SphereGeometry(0.28, 16, 16), bodyMat);
 earL.position.set(-0.6, 2.4, 0);
 const earR = earL.clone(); earR.position.x = 0.6;
 heroGroup.add(earL); heroGroup.add(earR);

 return heroGroup;
}

function createPlayer3DModel() {
 if (player3DGroup) scene.remove(player3DGroup);
 player3DGroup = createMLBBHero3D(selectedCharacter);
 scene.add(player3DGroup);
}

/* KESAN PARTICLES MAGIK MLBB (VFX) */
function buildVFXParticles() {
 magicParticles = [];
 const pGeo = new THREE.OctahedronGeometry(0.12);
 const pMat = new THREE.MeshBasicMaterial({ color: 0xffe17a });

 for (let i = 0; i < 20; i++) {
  const p = new THREE.Mesh(pGeo, pMat);
  p.position.set(-15 + Math.random() * 30, 1 + Math.random() * 6, -15 + Math.random() * 30);
  scene.add(p);
  magicParticles.push(p);
 }
}

function buildEnvironmentObjects() {
 const treeMat = new THREE.MeshToonMaterial({ color: 0x228b22 });
 const trunkMat = new THREE.MeshToonMaterial({ color: 0x4a2e18 });

 for (let i = 0; i < 16; i++) {
  const tree = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.4, 2), trunkMat);
  trunk.position.y = 1; tree.add(trunk);
  const top = new THREE.Mesh(new THREE.DodecahedronGeometry(1.6), treeMat);
  top.position.y = 2.8; tree.add(top);

  const angle = (i / 16) * Math.PI * 2;
  tree.position.set(Math.cos(angle) * 17, 0, Math.sin(angle) * 17);
  scene.add(tree);
 }
}

function move3D(dx, dz) {
 playerTargetPos.x += dx * 2.0;
 playerTargetPos.z += dz * 2.0;
 playerTargetPos.x = Math.max(-14, Math.min(14, playerTargetPos.x));
 playerTargetPos.z = Math.max(-14, Math.min(14, playerTargetPos.z));
 playerRotation = Math.atan2(dx, dz);
}

function animate3D() {
 requestAnimationFrame(animate3D);

 playerPos.x += (playerTargetPos.x - playerPos.x) * 0.14;
 playerPos.z += (playerTargetPos.z - playerPos.z) * 0.14;

 if (player3DGroup) {
  player3DGroup.position.set(playerPos.x, 0, playerPos.z);
  player3DGroup.rotation.y += (playerRotation - player3DGroup.rotation.y) * 0.2;
  const isMoving = Math.abs(playerTargetPos.x - playerPos.x) > 0.05 || Math.abs(playerTargetPos.z - playerPos.z) > 0.05;
  player3DGroup.position.y = isMoving ? Math.abs(Math.sin(Date.now() * 0.015)) * 0.35 : Math.sin(Date.now() * 0.003) * 0.05;
 }

 // Animasi Particles Magik Persekitaran
 magicParticles.forEach((p, idx) => {
  p.rotation.y += 0.03;
  p.position.y += Math.sin(Date.now() * 0.002 + idx) * 0.01;
 });

 // Kamera MOBA Pandangan Atas
 camera.position.x += (playerPos.x - camera.position.x) * 0.08;
 camera.position.z += (playerPos.z + 20 - camera.position.z) * 0.08;
 camera.lookAt(playerPos.x, 1.0, playerPos.z);

 renderer.render(scene, camera);
}

function onWindowResize() {
 camera.aspect = window.innerWidth / window.innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(window.innerWidth, window.innerHeight);
}

/* PRATONTON HERO 3D */
function initPreview3D(containerId) {
 const container = $(containerId);
 container.innerHTML = "";
 previewScene = new THREE.Scene();
 previewCamera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 100);
 previewCamera.position.set(0, 1.5, 5);

 previewRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
 previewRenderer.setSize(container.clientWidth, container.clientHeight);
 container.appendChild(previewRenderer.domElement);

 const light = new THREE.DirectionalLight(0xffffff, 1.4);
 light.position.set(3, 5, 3);
 previewScene.add(light);
 previewScene.add(new THREE.AmbientLight(0xffffff, 0.7));

 previewPlayerGroup = createMLBBHero3D(selectedCharacter);
 previewScene.add(previewPlayerGroup);

 function renderPreview() {
  if (!container.parentElement) return;
  requestAnimationFrame(renderPreview);
  if (previewPlayerGroup) previewPlayerGroup.rotation.y += 0.02;
  previewRenderer.render(previewScene, previewCamera);
 }
 renderPreview();
}

/* LOGIK PERMAINAN & SUPABASE */
function renderCharacterCards() {
 $("characterGrid").innerHTML = characters.map(c => `
  <div class="character-card ${selectedCharacter === c.id ? "selected" : ""}" onclick="chooseCharacter('${c.id}')">
   <b>${c.name}</b>
  </div>`).join("");
 initPreview3D("characterPreview3D");
}
function chooseCharacter(id) { selectedCharacter = id; renderCharacterCards(); }
function confirmCharacter() { createPlayer3DModel(); showScreen("introScreen"); initPreview3D("menuCharacter3D"); }
function openCharacterPicker() { renderCharacterCards(); showScreen("characterScreen"); }

function beginOpening() { showScreen("authScreen"); }
function toggleSignup() { authMode = "signup"; $("authHeading").textContent = "Daftar Akaun"; $("signupName").classList.remove("hidden"); }
function toggleLogin() { authMode = "login"; $("authHeading").textContent = "Log Masuk"; $("signupName").classList.add("hidden"); }

async function authenticate() {
 const email = $("email").value.trim(), password = $("password").value;
 if (!email || !password) return;
 try {
  const { data, error } = await db.auth.signInWithPassword({ email, password });
  if (error) throw error; currentUser = data.user;
  showScreen("introScreen"); initPreview3D("menuCharacter3D");
 } catch (e) { toast(e.message); }
}
async function signOut() { await db.auth.signOut(); showScreen("authScreen"); }

function startGame() {
 showScreen("gameScreen");
 if (!renderer) init3DEngine();
}
function backToIntro() { showScreen("introScreen"); initPreview3D("menuCharacter3D"); }
function openMap() { $("mapModal").classList.remove("hidden"); }
function closeMap() { $("mapModal").classList.add("hidden"); }
