<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#102b35">
<title>KARAKTER QUEST 2027</title>
<style>
*{box-sizing:border-box}
:root{
 --ink:#17343b;--gold:#ffd66b;--cream:#fff7df;
 --green:#40c98a;--blue:#51c8ed;--pink:#ff83ad;
 --purple:#9d83f6;--orange:#ffae55;
}
html,body{margin:0;width:100%;height:100%;overflow:hidden;
 font-family:system-ui,Arial,sans-serif;background:#102b35;color:white}
button{font:inherit;cursor:pointer;border:0}
#game{position:relative;width:100%;height:100%;overflow:hidden;background:#153b43}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#topbar{position:absolute;z-index:5;top:0;left:0;right:0;
 display:flex;align-items:center;justify-content:space-between;padding:10px 13px;
 background:linear-gradient(180deg,rgba(8,35,42,.82),transparent)}
.brand{font-size:13px;font-weight:1000;letter-spacing:1.5px;color:#ffe18a}
.brand small{display:block;font-size:9px;letter-spacing:2px;color:#c9f5df}
.pill{background:#102e38cc;border:1px solid #ffffff35;border-radius:30px;
 padding:7px 12px;font-size:11px;font-weight:800}
#sceneTitle{position:absolute;z-index:3;top:65px;left:50%;transform:translateX(-50%);
 background:#102e38b8;border:1px solid #ffffff45;border-radius:20px;
 padding:7px 16px;font-weight:900;font-size:12px;white-space:nowrap}
#bottom{position:absolute;z-index:5;left:0;right:0;bottom:0;
 padding:12px 13px max(13px,env(safe-area-inset-bottom));
 background:linear-gradient(0deg,rgba(7,30,37,.96),rgba(7,30,37,.82),transparent)}
#message{min-height:48px;text-align:center;font-size:13px;line-height:1.4;
 font-weight:650;padding:5px 10px;color:#fff7df}
.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.action{background:linear-gradient(135deg,#ffe58c,#ffb64e);color:#533819;
 padding:10px 15px;border-radius:14px;font-weight:950;font-size:12px;
 box-shadow:0 4px 0 #9a632d}
.action.secondary{background:linear-gradient(135deg,#8ce9d1,#44bda9);color:#103c3a;box-shadow:0 4px 0 #247e75}
.action.purple{background:linear-gradient(135deg,#d0b5ff,#9b7af0);color:#30205c;box-shadow:0 4px 0 #6044a6}
#pad{position:absolute;z-index:5;bottom:125px;left:16px;display:grid;
 grid-template-columns:42px 42px 42px;grid-template-rows:42px 42px 42px;gap:4px}
.padbtn{border-radius:13px;background:#123d4ccc;border:1px solid #ffffff55;
 color:white;font-size:20px;font-weight:900;touch-action:none}
.padbtn:active{background:#ffcf68;color:#473019}
#panel{position:absolute;z-index:10;inset:0;display:flex;align-items:center;
 justify-content:center;padding:17px;background:linear-gradient(135deg,#103d49eF,#142c48ed)}
#panel.hidden{display:none}
.panelbox{width:min(520px,100%);max-height:92%;overflow:auto;
 background:linear-gradient(145deg,#fff9e8,#d9f6e9);
 color:#18383e;border-radius:25px;padding:23px 19px;
 box-shadow:0 18px 60px #061c26a8;border:3px solid #ffffff}
h1{font-size:clamp(25px,6vw,39px);line-height:1.04;margin:0 0 9px;
 color:#154b50;font-weight:1000;letter-spacing:-1px}
h2{margin:0 0 10px;color:#15505a;font-size:23px}
.sub{font-size:12px;color:#527477;font-weight:800;letter-spacing:1.5px}
.desc{font-size:14px;line-height:1.55;color:#34565a}
.bigicon{font-size:58px;text-align:center;margin:8px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:14px 0}
.charcard{border-radius:16px;padding:13px 8px;background:white;
 border:2px solid #c4e8dc;text-align:center;color:#21484b}
.charcard b{display:block;font-size:13px;margin-top:5px}
.charcard span{font-size:35px}
.charcard.selected{border:3px solid #f2a944;background:#fff2c8}
.charcard small{font-size:10px;color:#668181}
.line{height:1px;background:#b8d9cf;margin:15px 0}
.choice{display:block;width:100%;text-align:left;margin:8px 0;padding:13px;
 border-radius:14px;background:#fff;border:2px solid #b9e2d5;
 color:#20484a;font-weight:800;font-size:13px}
.choice:active{background:#fff0bd}
#toast{position:absolute;z-index:8;top:18%;left:50%;transform:translateX(-50%);
 background:#fff2c7;color:#573c19;border-radius:30px;padding:10px 18px;
 font-weight:900;font-size:12px;display:none;box-shadow:0 5px 20px #0004}
@media(max-height:600px){
 #pad{bottom:105px;transform:scale(.82);transform-origin:bottom left}
 #bottom{padding-top:5px}
 #message{min-height:35px;font-size:11px}
 .panelbox{padding:15px}
}
</style>
</head>
<body>
<div id="game">
 <canvas id="world"></canvas>
 <div id="topbar">
  <div class="brand">KARAKTER QUEST <small>2027 · BORNEO ADVENTURE</small></div>
  <div style="display:flex;gap:7px">
   <div class="pill" id="rank">PREBET</div>
   <button class="pill" id="journalBtn">📖 JURNAL</button>
  </div>
 </div>
 <div id="sceneTitle">KAMPUNG SUNGAI</div>
 <div id="toast"></div>
 <div id="pad">
  <div></div><button class="padbtn" data-dir="up">▲</button><div></div>
  <button class="padbtn" data-dir="left">◀</button>
  <button class="padbtn" data-dir="down">▼</button>
  <button class="padbtn" data-dir="right">▶</button>
  <div></div><div></div><div></div>
 </div>
 <div id="bottom">
  <div id="message">Selamat datang ke dunia KARAKTER QUEST 2027.</div>
  <div class="actions">
   <button class="action" id="interact">INTERAKSI</button>
   <button class="action secondary" id="mapBtn">PETA DUNIA</button>
   <button class="action purple" id="soundBtn">♫ AUDIO</button>
  </div>
 </div>
 <div id="panel">
  <div class="panelbox" id="panelContent"></div>
 </div>
</div>
<script>
(()=>{
"use strict";
const canvas=document.getElementById("world");
const ctx=canvas.getContext("2d");
const panel=document.getElementById("panel");
const pc=document.getElementById("panelContent");
const message=document.getElementById("message");
const title=document.getElementById("sceneTitle");
const toast=document.getElementById("toast");

let W=0,H=0,D=1;
let state={
 started:false,hero:0,x:0,y:0,dir:"down",moving:false,
 scene:0,completed:[],journal:[],decisions:{},sound:false
};
const characters=[
 {name:"Karakter 1",emoji:"🐿️",color:"#d58b4c",core:"Penyayang"},
 {name:"Karakter 2",emoji:"🐻",color:"#b97c58",core:"Berdaya Tahan"},
 {name:"Karakter 3",emoji:"🐦",color:"#4c9ce0",core:"Berupaya Memimpin"},
 {name:"Karakter 4",emoji:"🐱",color:"#e9a5bd",core:"Warganegara Aktif"},
 {name:"Karakter 5",emoji:"🦌",color:"#c99a62",core:"Pengembaraan"}
];
const places=[
 {name:"Kampung Sungai",x:.5,y:.56,icon:"🏡",color:"#ffd16b"},
 {name:"Jeti",x:.82,y:.64,icon:"🛶",color:"#61d3ed"},
 {name:"Rumah Panjang",x:.22,y:.42,icon:"🏘️",color:"#f7a46b"},
 {name:"Tebing Sungai",x:.73,y:.30,icon:"🌊",color:"#6bd4e8"},
 {name:"Laluan Hutan",x:.30,y:.19,icon:"🌳",color:"#83df9d"},
 {name:"Balai Kampung",x:.50,y:.34,icon:"🏛️",color:"#d0a4ff"}
];
const missions=[
 {name:"MISI 1 · KENALI DIRI",core:"Penyayang",
  npc:"Penduduk kampung",text:"Seorang penduduk membawa barang yang berat. Dia kelihatan memerlukan bantuan.",
  options:[
   ["Mendekati dan menawarkan bantuan dengan ikhlas.","Tindakan penyayang"],
   ["Berlalu kerana menganggap itu bukan urusan kita.","Memilih untuk tidak membantu"],
   ["Mengajak rakan lain membantu bersama.","Kerjasama dan keprihatinan"]
  ]},
 {name:"MISI 2 · CABARAN DIRI",core:"Berdaya Tahan",
  npc:"Rakan pengembara",text:"Hujan lebat menyebabkan laluan yang hendak dilalui menjadi sukar.",
  options:[
   ["Berhenti, menilai keadaan dan mencari laluan selamat.","Berfikir sebelum bertindak"],
   ["Terus mara tanpa memikirkan risiko.","Tindakan terburu-buru"],
   ["Mengajak rakan mencari jalan penyelesaian.","Ketabahan dan kerjasama"]
  ]},
 {name:"MISI 3 · PIMPINAN",core:"Berupaya Memimpin",
  npc:"Ketua kumpulan",text:"Kumpulan kamu perlu membuat keputusan bersama untuk menyelesaikan satu tugasan.",
  options:[
   ["Mendengar pandangan semua sebelum membuat keputusan.","Kepimpinan yang adil"],
   ["Membuat keputusan sendiri tanpa mendengar orang lain.","Kurang pertimbangan"],
   ["Memberi tugasan mengikut kebolehan setiap ahli.","Kepimpinan dan amanah"]
  ]},
 {name:"MISI 4 · KOMUNITI",core:"Warganegara Aktif",
  npc:"Penduduk setempat",text:"Kawasan sekitar kampung perlu dibersihkan sebelum program komuniti bermula.",
  options:[
   ["Turut serta menjaga kebersihan kawasan.","Tanggungjawab bersama"],
   ["Menunggu orang lain melakukannya.","Kurang penglibatan"],
   ["Mengajak jiran dan rakan menyertai gotong-royong.","Inisiatif komuniti"]
  ]},
 {name:"MISI 5 · BERSAMA KITA KUAT",core:"Empat Teras Karakter",
  npc:"Warga kampung",text:"Satu masalah kampung memerlukan bantuan, ketabahan, kepimpinan dan kerjasama semua.",
  options:[
   ["Menggabungkan kekuatan setiap ahli untuk bertindak.","Kekuatan bersama"],
   ["Membiarkan seorang sahaja menyelesaikan semuanya.","Kurang kerjasama"],
   ["Menyusun tindakan dan melibatkan seluruh komuniti.","Tindakan berkarakter"]
  ]}
];
let selected=0,keys={},last=0,frame=0;
let audioCtx=null,oscTimer=null;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){
 D=Math.min(devicePixelRatio||1,2);
 W=innerWidth;H=innerHeight;
 canvas.width=W*D;canvas.height=H*D;
 ctx.setTransform(D,0,0,D,0,0);
}
addEventListener("resize",resize);resize();

function rounded(x,y,w,h,r,color){
 ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();
}
function ellipse(x,y,rx,ry,color){
 ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill();
}
function gradient(y1,y2,c1,c2){
 let g=ctx.createLinearGradient(0,y1,0,y2);g.addColorStop(0,c1);g.addColorStop(1,c2);return g;
}
function drawTree(x,y,s=1){
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);
 rounded(-7,0,14,58,5,"#855536");
 ellipse(0,-15,34,38,"#168b64");
 ellipse(-20,-2,24,27,"#23a978");
 ellipse(20,-3,25,28,"#39bd78");
 ellipse(0,-38,23,24,"#54d18a");
 ellipse(-10,-40,6,4,"#a4ef9a");
 ctx.restore();
}
function drawHouse(x,y,s=1){
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);
 rounded(-44,-5,88,48,5,"#e8bd7e");
 ctx.fillStyle="#9e6049";ctx.beginPath();ctx.moveTo(-52,-5);ctx.lineTo(0,-42);ctx.lineTo(52,-5);ctx.closePath();ctx.fill();
 rounded(-9,12,18,31,3,"#8b6046");
 rounded(-35,5,17,15,3,"#85d9e8");
 rounded(18,5,17,15,3,"#85d9e8");
 ctx.fillStyle="#d9a76a";ctx.fillRect(-48,43,96,5);
 ctx.restore();
}
function drawWorld(){
 frame++;
 let sky=gradient(0,H*.65,"#58c9ee","#b5f0df");
 ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 // sunlight
 let sun=ctx.createRadialGradient(W*.79,H*.16,4,W*.79,H*.16,75);
 sun.addColorStop(0,"#fff7a8");sun.addColorStop(1,"#fff7a800");
 ctx.fillStyle=sun;ctx.fillRect(0,0,W,H*.5);
 ellipse(W*.79,H*.16,27,27,"#ffe78a");
 // mountains
 ctx.fillStyle="#72c99a";
 ctx.beginPath();ctx.moveTo(0,H*.52);ctx.lineTo(W*.15,H*.2);ctx.lineTo(W*.31,H*.49);
 ctx.lineTo(W*.49,H*.17);ctx.lineTo(W*.68,H*.51);ctx.lineTo(W*.85,H*.24);
 ctx.lineTo(W,H*.49);ctx.lineTo(W,H*.65);ctx.lineTo(0,H*.65);ctx.fill();
 ctx.fillStyle="#4aa77e";
 ctx.beginPath();ctx.moveTo(0,H*.55);ctx.lineTo(W*.2,H*.34);ctx.lineTo(W*.39,H*.58);
 ctx.lineTo(W*.61,H*.31);ctx.lineTo(W*.8,H*.58);ctx.lineTo(W,H*.39);
 ctx.lineTo(W,H*.68);ctx.lineTo(0,H*.68);ctx.fill();
 // ground
 ctx.fillStyle=gradient(H*.52,H,"#8be1a1","#278c68");
 ctx.fillRect(0,H*.52,W,H*.48);
 // river
 ctx.fillStyle="#42b9d4";ctx.beginPath();
 ctx.moveTo(W*.61,H*.48);ctx.bezierCurveTo(W*.48,H*.63,W*.83,H*.72,W*.65,H);
 ctx.lineTo(W*.99,H);ctx.bezierCurveTo(W*.88,H*.75,W*.76,H*.64,W*.83,H*.48);ctx.closePath();ctx.fill();
 ctx.strokeStyle="#b5f2ec";ctx.lineWidth=4;
 ctx.beginPath();ctx.moveTo(W*.72,H*.59);ctx.quadraticCurveTo(W*.62,H*.72,W*.8,H*.87);ctx.stroke();
 // hills
 ellipse(W*.05,H*.67,W*.37,H*.19,"#48b77d");
 ellipse(W*.98,H*.68,W*.36,H*.2,"#3cae77");
 // trees
 for(let i=0;i<11;i++){
  let x=(i*137+35)%W;
  let y=H*(.49+((i*17)%18)/100);
  drawTree(x,y,.55+((i%3)*.15));
 }
 // buildings
 drawHouse(W*.22,H*.57,.72);
 drawHouse(W*.48,H*.53,.85);
 drawHouse(W*.91,H*.59,.58);
 // paths
 ctx.strokeStyle="#e9ca8b";ctx.lineWidth=23;ctx.lineCap="round";
 ctx.beginPath();ctx.moveTo(W*.47,H*.68);ctx.quadraticCurveTo(W*.35,H*.77,W*.22,H*.62);ctx.stroke();
 ctx.beginPath();ctx.moveTo(W*.5,H*.68);ctx.quadraticCurveTo(W*.68,H*.72,W*.78,H*.61);ctx.stroke();
 ctx.strokeStyle="#fff0c2";ctx.lineWidth=2;
 ctx.beginPath();ctx.moveTo(W*.47,H*.68);ctx.quadraticCurveTo(W*.35,H*.77,W*.22,H*.62);ctx.stroke();
 // flowers
 for(let i=0;i<23;i++){
  let x=(i*83+17)%W,y=H*(.65+((i*13)%27)/100);
  ellipse(x,y,3,3,["#ffdf75","#ff8fb2","#fff5d1"][i%3]);
 }
 drawLocations();
 drawHero();
}
function drawLocations(){
 places.forEach((p,i)=>{
  let x=p.x*W,y=p.y*H;
  if(i===state.scene){
   ctx.beginPath();ctx.arc(x,y,25+Math.sin(frame*.08)*3,0,Math.PI*2);
   ctx.strokeStyle="#fff2a0";ctx.lineWidth=3;ctx.stroke();
  }
  ellipse(x,y+8,19,7,"#174b4c55");
  rounded(x-18,y-28,36,35,12,"#fff5d9");
  ctx.font="21px sans-serif";ctx.textAlign="center";ctx.fillText(p.icon,x,y-4);
 }
}
function drawHero(){
 let x=state.x*W,y=state.y*H;
 if(!state.started){x=W*.5;y=H*.69}
 let c=characters[state.hero]||characters[0];
 let bob=state.moving?Math.sin(frame*.3)*3:Math.sin(frame*.07)*1.5;
 // shadow
 ellipse(x,y+21,19,7,"#174b4b55");
 // legs
 let step=state.moving?Math.sin(frame*.34)*6:0;
 ctx.strokeStyle="#573c35";ctx.lineWidth=7;ctx.lineCap="round";
 ctx.beginPath();ctx.moveTo(x-7,y+6+bob);ctx.lineTo(x-9-step,y+19);ctx.stroke();
 ctx.beginPath();ctx.moveTo(x+7,y+6+bob);ctx.lineTo(x+9+step,y+19);ctx.stroke();
 // body
 rounded(x-14,y-17+bob,28,29,11,c.color);
 // arms
 ctx.strokeStyle=c.color;ctx.lineWidth=7;
 ctx.beginPath();ctx.moveTo(x-12,y-9+bob);ctx.lineTo(x-21,y+2+bob+step*.3);ctx.stroke();
 ctx.beginPath();ctx.moveTo(x+12,y-9+bob);ctx.lineTo(x+21,y+2+bob-step*.3);ctx.stroke();
 // head
 ellipse(x,y-28+bob,19,18,c.color);
 // ears / character details
 if(state.hero===0){
  ellipse(x-10,y-47+bob,6,15,c.color);ellipse(x+10,y-47+bob,6,15,c.color);
 }else if(state.hero===1){
  ellipse(x-12,y-29+bob,6,7,"#7a4938");ellipse(x+12,y-29+bob,6,7,"#7a4938");
 }else if(state.hero===2){
  ctx.fillStyle="#f5c84f";ctx.beginPath();ctx.moveTo(x-9,y-43+bob);ctx.lineTo(x-4,y-56+bob);ctx.lineTo(x,y-43+bob);ctx.fill();
  ctx.beginPath();ctx.moveTo(x,y-43+bob);ctx.lineTo(x+7,y-55+bob);ctx.lineTo(x+10,y-40+bob);ctx.fill();
 }else if(state.hero===3){
  ellipse(x-16,y-40+bob,5,10,c.color);ellipse(x+16,y-40+bob,5,10,c.color);
 }else{
  ctx.strokeStyle="#8b603e";ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(x-8,y-41+bob);ctx.lineTo(x-14,y-53+bob);ctx.lineTo(x-20,y-55+bob);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x+8,y-41+bob);ctx.lineTo(x+14,y-53+bob);ctx.lineTo(x+20,y-55+bob);ctx.stroke();
 }
 // face
 ellipse(x-6,y-29+bob,2,2,"#243b3d");ellipse(x+6,y-29+bob,2,2,"#243b3d");
 ellipse(x,y-22+bob,3,2,"#68433c");
 ctx.strokeStyle="#68433c";ctx.lineWidth=1.5;
 ctx.beginPath();ctx.arc(x,y-23+bob,5,.2,2.9);ctx.stroke();
}
function loop(t){
 let dt=Math.min((t-last)/1000,.04);last=t;
 if(state.started){
  let dx=0,dy=0;
  if(keys.left||keys.ArrowLeft)dx--;
  if(keys.right||keys.ArrowRight)dx++;
  if(keys.up||keys.ArrowUp)dy--;
  if(keys.down||keys.ArrowDown)dy++;
  if(dx||dy){
   let len=Math.hypot(dx,dy);dx/=len;dy/=len;
   state.x=clamp(state.x+dx*dt*.36,.06,.94);
   state.y=clamp(state.y+dy*dt*.36,.17,.83);
   state.moving=true;state.dir=dx<0?"left":dx>0?"right":dy<0?"up":"down";
  }else state.moving=false;
 }
 drawWorld();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function showToast(t){
 toast.textContent=t;toast.style.display="block";
 clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.style.display="none",1900);
}
function openPanel(html){
 pc.innerHTML=html;panel.classList.remove("hidden");
}
function closePanel(){panel.classList.add("hidden")}
function welcome(){
 openPanel(`
 <div class="sub">DUNIA PENGEMBARAAN BORNEO</div>
 <h1>KARAKTER<br>QUEST 2027</h1>
 <div class="bigicon">🌈 🌴 🏡</div>
 <p class="desc">Sebuah pengembaraan untuk mengenali dan membina karakter. Setiap tindakan membawa makna. Setiap pilihan memberi kesan kepada dunia sekeliling.</p>
 <div class="line"></div>
 <h2>Empat Teras Karakter</h2>
 <div class="desc">💚 Penyayang<br>🔥 Berdaya Tahan<br>👑 Berupaya Memimpin<br>🌏 Warganegara Aktif</div>
 <br><button class="action" id="begin" style="width:100%">MULAKAN PENGEMBARAAN</button>
 `);
 document.getElementById("begin").onclick=chooseHero;
}
function chooseHero(){
 openPanel(`
 <div class="sub">PERSIAPAN PENGEMBARA</div>
 <h2>Pilih Watak</h2>
 <p class="desc">Pilih watak pengembaraan kamu.</p>
 <div class="cards" id="characterCards">
 ${characters.map((c,i)=>`<button class="charcard ${i===selected?"selected":""}" data-id="${i}">
 <span>${c.emoji}</span><b>${c.name}</b><small>${c.core}</small></button>`).join("")}
 </div>
 <button class="action" id="confirm" style="width:100%">SAHKAN WATAK</button>
 `);
 pc.querySelectorAll(".charcard").forEach(b=>b.onclick=()=>{
  selected=Number(b.dataset.id);chooseHero();
 });
 document.getElementById("confirm").onclick=()=>{
  state.hero=selected;state.started=true;state.x=.5;state.y=.69;
  save();closePanel();
  message.textContent="Pengembaraan bermula! Terokai kampung dan dekati penduduk untuk berinteraksi.";
  showToast("Watak dipilih!");
  audioStart();
 };
}
function nearestPlace(){
 let best=null,dist=999;
 places.forEach((p,i)=>{
  let d=Math.hypot(state.x-p.x,state.y-p.y);
  if(d<dist){dist=d;best=i}
 });
 return dist<.15?best:null;
}
function interact(){
 if(!state.started)return;
 let p=nearestPlace();
 if(p===null){
  message.textContent="Bergerak ke kawasan penduduk, rumah panjang atau lokasi yang ditandakan untuk berinteraksi.";
  return;
 }
 state.scene=p;title.textContent=places[p].name.toUpperCase();
 let next=state.completed.length;
 if(next>=5){showCompletion();return}
 if(p===0||p===5||p===2){
  showMission(next);
 }else{
  openPanel(`<div class="bigicon">${places[p].icon}</div><h2>${places[p].name}</h2>
  <p class="desc">Kawasan ini sebahagian daripada dunia pengembaraan KP2027. Teruskan meneroka dan berinteraksi dengan penduduk kampung.</p>
  <button class="action" id="back" style="width:100%">KEMBALI KE DUNIA</button>`);
  document.getElementById("back").onclick=closePanel;
 }
}
function showMission(n){
 let m=missions[n];
 openPanel(`
 <div class="sub">TAHAP 1 · MISI KENALI KARAKTER</div>
 <h2>${m.name}</h2>
 <div class="bigicon">🧑‍🌾</div>
 <p class="desc"><b>${m.npc}</b><br>${m.text}</p>
 <div class="line"></div>
 <p class="desc"><b>Apakah tindakan kamu?</b></p>
 ${m.options.map((o,i)=>`<button class="choice" data-choice="${i}">${["A","B","C"][i]}. ${o[0]}</button>`).join("")}
 <button class="action secondary" id="leave" style="width:100%">KELUAR</button>
 `);
 pc.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>{
  let i=Number(b.dataset.choice);
  let result=m.options[i][1];
  state.decisions[n]=i;
  state.completed.push(n);
  state.journal.push({mission:m.name,core:m.core,choice:m.options[i][0],result});
  save();
  showResult(m,result,i);
 });
 document.getElementById("leave").onclick=closePanel;
}
function showResult(m,result,i){
 let words=[
  "Tindakan kamu menjadi sebahagian daripada perjalanan membina karakter.",
  "Setiap pengalaman memberi peluang untuk berfikir dan memperbaiki tindakan.",
  "Pilihan kamu memberi kesan kepada hubungan dengan masyarakat."
 ];
 openPanel(`
 <div class="bigicon">${i===0?"🌟":i===1?"🌱":"🤝"}</div>
 <div class="sub">KESAN TINDAKAN</div>
 <h2>${result}</h2>
 <p class="desc">${words[i]}</p>
 <p class="desc">Teras karakter: <b>${m.core}</b></p>
 <button class="action" id="continue" style="width:100%">TERUSKAN PENGEMBARAAN</button>
 `);
 document.getElementById("continue").onclick=()=>{
  closePanel();
  if(state.completed.length===5)showCompletion();
  else message.textContent="Misi direkodkan dalam jurnal. Teruskan pengembaraan dan kenali karakter melalui pengalaman.";
 };
}
function showCompletion(){
 let n=state.completed.length;
 openPanel(`
 <div class="bigicon">🏅🌈</div>
 <div class="sub">TAHNIAH, PENGEMBARA!</div>
 <h2>Lima Misi Selesai</h2>
 <p class="desc">Kamu telah melalui pengalaman membina empat teras karakter. Perjalanan ini bukan sekadar tentang sampai ke destinasi, tetapi tentang tindakan dan nilai yang dibawa.</p>
 <div class="line"></div>
 <h2>🏅 PAHLAWAN RUMAH</h2>
 <p class="desc">Lima misi diselesaikan. Guru boleh memberikan ganjaran sebenar mengikut sistem KP2027.</p>
 <button class="action" id="done" style="width:100%">KEMBALI KE DUNIA</button>
 `);
 document.getElementById("done").onclick=()=>{
  closePanel();showToast("Pangkat: Pahlawan Rumah");
  document.getElementById("rank").textContent="PAHLAWAN RUMAH";
 };
}
function showJournal(){
 let rows=state.journal.length?state.journal.map((j,i)=>`
 <div style="background:#fff;padding:11px;border-radius:12px;margin:8px 0">
 <b>${i+1}. ${j.mission}</b><br>
 <small>${j.core}</small><p class="desc" style="margin:5px 0">${j.choice}</p>
 <small style="color:#16846d">${j.result}</small>
 </div>`).join(""):"<p class='desc'>Belum ada catatan. Mulakan misi untuk mengisi jurnal pengembaraan.</p>";
 openPanel(`<div class="sub">CATATAN PENGEMBARA</div><h2>📖 Jurnal Karakter</h2>${rows}
 <button class="action" id="jclose" style="width:100%">TUTUP JURNAL</button>`);
 document.getElementById("jclose").onclick=closePanel;
}
function showMap(){
 openPanel(`<div class="sub">DUNIA BORNEO · SARAWAK</div><h2>🗺️ Peta Pengembaraan</h2>
 <p class="desc">Pilih kawasan untuk menuju ke lokasi tersebut.</p>
 <div class="cards">${places.map((p,i)=>`<button class="charcard" data-place="${i}">
 <span>${p.icon}</span><b>${p.name}</b><small>Lokasi pengembaraan</small></button>`).join("")}</div>
 <button class="action secondary" id="mapclose" style="width:100%">KEMBALI</button>`);
 pc.querySelectorAll("[data-place]").forEach(b=>b.onclick=()=>{
  let p=places[Number(b.dataset.place)];
  state.x=p.x;state.y=p.y;state.scene=Number(b.dataset.place);
  title.textContent=p.name.toUpperCase();
  closePanel();message.textContent="Kamu tiba di "+p.name+". Tekan INTERAKSI untuk meneroka.";
 });
 document.getElementById("mapclose").onclick=closePanel;
}
function save(){
 try{localStorage.setItem("KP2027_SAVE",JSON.stringify(state))}catch(e){}
}
function load(){
 try{
  let s=JSON.parse(localStorage.getItem("KP2027_SAVE")||"null");
  if(s&&Array.isArray(s.completed)&&Array.isArray(s.journal)){
   state={...state,...s};
   selected=state.hero||0;
   if(state.completed.length>=5)document.getElementById("rank").textContent="PAHLAWAN RUMAH";
  }
 }catch(e){}
}
function audioStart(){
 if(state.sound)return;
 try{
  audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended")audioCtx.resume();
  state.sound=true;
  document.getElementById("soundBtn").textContent="♫ AUDIO ON";
  let notes=[392,440,523,587,523,440,349,392];
  let k=0;
  oscTimer=setInterval(()=>{
   if(!state.sound||!audioCtx)return;
   let o=audioCtx.createOscillator(),g=audioCtx.createGain();
   o.type="sine";o.frequency.value=notes[k++%notes.length];
   g.gain.setValueAtTime(.0001,audioCtx.currentTime);
   g.gain.exponentialRampToValueAtTime(.035,audioCtx.currentTime+.03);
   g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.28);
   o.connect(g);g.connect(audioCtx.destination);
   o.start();o.stop(audioCtx.currentTime+.3);
  },330);
 }catch(e){showToast("Audio tidak disokong oleh peranti ini")}
}
function audioStop(){
 state.sound=false;clearInterval(oscTimer);
 document.getElementById("soundBtn").textContent="♫ AUDIO";
}
document.getElementById("soundBtn").onclick=()=>state.sound?audioStop():audioStart();
document.getElementById("interact").onclick=interact;
document.getElementById("mapBtn").onclick=showMap;
document.getElementById("journalBtn").onclick=showJournal;
document.querySelectorAll(".padbtn").forEach(b=>{
 let d=b.dataset.dir;
 b.addEventListener("pointerdown",e=>{e.preventDefault();keys[d]=true});
 ["pointerup","pointercancel","pointerleave"].forEach(ev=>b.addEventListener(ev,e=>{keys[d]=false}));
});
addEventListener("keydown",e=>{
 let k=e.key.toLowerCase();
 if(["arrowup","arrowdown","arrowleft","arrowright","w","a","s","d"].includes(k)){
  e.preventDefault();
  keys[k.startsWith("arrow")?k:k==="w"?"up":k==="s"?"down":k==="a"?"left":"right"]=true;
 }
 if(k===" "||k==="enter")interact();
});
addEventListener("keyup",e=>{
 let k=e.key.toLowerCase();
 if(k.startsWith("arrow"))keys[k]=false;
 if(["w","a","s","d"].includes(k))keys[k==="w"?"up":k==="s"?"down":k==="a"?"left":"right"]=false;
});
document.addEventListener("visibilitychange",()=>{if(document.hidden)keys={}});
load();
welcome();
})();
</script>
</body>
</html>
